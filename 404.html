<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MESCE - Página não encontrada</title>
  <link rel="icon" href="https://iili.io/CQEddFI.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      color: #1b2a35;
      background: linear-gradient(180deg, #f2fafd 0%, #e7f4fa 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #38b6ff;
      background: #fff;
      margin-bottom: 24px;
      box-shadow: 0 6px 24px rgba(11, 83, 148, 0.2);
    }
    .codigo {
      font-size: 5rem;
      font-weight: 700;
      color: #0b5394;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1b2a35;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #5a7486;
      margin-bottom: 24px;
      max-width: 400px;
    }
    .botoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .botao {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.2s;
    }
    .botao-primario {
      background: #0b5394;
      color: #fff;
    }
    .botao-primario:hover { background: #083a6b; transform: translateY(-1px); }
    .botao-secundario {
      background: transparent;
      color: #0b5394;
      border: 1px solid #cfe6f2;
    }
    .botao-secundario:hover { background: #eaf6fc; }
    .rodape {
      margin-top: 40px;
      font-size: 0.78rem;
      color: #5a7486;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://iili.io/CQEddFI.jpg" alt="Logo MESCE">
  <div class="codigo">404</div>
  <h1>Página não encontrada</h1>
  <p>O link que você acessou não existe ou foi movido para outro endereço.</p>
  <div class="botoes">
    <a class="botao botao-primario" href="index.html">Página Inicial</a>
    <a class="botao botao-secundario" href="dashboard.html">Dashboard</a>
    <a class="botao botao-secundario" href="formulario.html">Formulário</a>
  </div>
  <p class="rodape">MESCE &mdash; Ministros Extraordinários da Sagrada Comunhão Eucarística</p>
</body>
</html>
